name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          docker build -t ${{ env.REGISTRY }}/$IMAGE_NAME:${{ github.sha }} -f docker/wordpress/Dockerfile .
          docker push ${{ env.REGISTRY }}/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: root
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            kubectl set image deployment/wordpress wordpress=docker.io/library/wordpress-custom:6.4.2
            kubectl rollout status deployment/wordpress
