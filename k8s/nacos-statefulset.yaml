apiVersion: v1
kind: Service
metadata:
  name: nacos-headless
spec:
  clusterIP: None
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
    - name: grpc
      port: 9848
    - name: console
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nacos
spec:
  serviceName: nacos-headless
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nacos/nacos-server:v3.2.4
          env:
            - name: MODE
              value: standalone
            - name: NACOS_SERVERS
              value: "nacos-0.nacos-headless:8848"
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: MYSQL_SERVICE_HOST
              value: mysql-headless
            - name: MYSQL_SERVICE_DB_NAME
              value: nacos_config
            - name: MYSQL_SERVICE_USER
              value: root
            - name: MYSQL_SERVICE_PASSWORD
              value: "YourRootPass123"
            - name: MYSQL_SERVICE_DB_PARAM
              value: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
            - name: NACOS_AUTH_TOKEN
              value: "MHVIMDBBaEZTREtaUkNJcjdOY0RSOFFRbmlSaUx6NWZaOU4rRVhjUEoxaz0="
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "nacos"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "nacos"
            - name: JVM_XMS
              value: "512m"
            - name: JVM_XMX
              value: "512m"
            - name: JVM_XMN
              value: "256m"
          ports:
            - containerPort: 8848
            - containerPort: 9848
          resources:
            requests:
              memory: "1Gi"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /nacos/v3/admin/core/state/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
