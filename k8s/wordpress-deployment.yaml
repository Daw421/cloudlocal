apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db
type: Opaque
stringData:
  WORDPRESS_DB_HOST: "mysql-headless:3306"
  WORDPRESS_DB_USER: "root"
  WORDPRESS_DB_PASSWORD: "YourRootPass123"
  WORDPRESS_DB_NAME: "wordpress"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: docker.io/library/wordpress-custom:6.4.2 
          envFrom:
            - secretRef:
                name: wordpress-db
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html/wp-content
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wordpress-data
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
